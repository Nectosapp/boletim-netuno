name: Boletim Diário Grupo Netuno

on:
  # Disparo automático às 07:00 Brasília (10:00 UTC)
  schedule:
    - cron: '0 10 * * *'  # Todos os dias, 10:00 UTC = 07:00 BRT

  # Permite disparo manual pelo GitHub
  workflow_dispatch:

jobs:
  enviar-boletim:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar boletim
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python boletim_github_version.py
