name: Boletim DOCX Grupo Netuno

on:
  # Diário seg-sex às 07:00 Brasília (10:00 UTC)
  schedule:
    - cron: '0 10 * * 1-5'

  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Enviar apenas para email de teste'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  gerar-e-enviar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar boletim docx
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BOLETIM_DOCX_TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        run: |
          python boletim_docx.py

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boletim-docx-${{ github.run_id }}
          path: output_docx/
          retention-days: 7
