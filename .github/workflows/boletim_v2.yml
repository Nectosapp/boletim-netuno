name: Boletim Diário Grupo Netuno (v2)

on:
  # Disparo automático de segunda a sexta às 06:30 Brasília (09:30 UTC)
  schedule:
    - cron: '30 9 * * 1-5'

  # Permite disparo manual pelo GitHub
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Enviar apenas para email de teste'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  enviar-boletim:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar boletim v2
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BOLETIM_TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
          # Ingest pro app Netuno Investimentos. Se algum desses for vazio,
          # o script só loga "skip" e continua o envio normal de email.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          DAILY_NEWS_CRON_SECRET: ${{ secrets.DAILY_NEWS_CRON_SECRET }}
          # Anon key — só pra passar o gateway de auth da Supabase (Bearer obrigatório).
          # Auth real da função é o x-cron-secret.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python boletim_netuno_v2.py
