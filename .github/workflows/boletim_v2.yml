name: Boletim Diário Grupo Netuno (v2)

on:
  # Disparo automático de segunda a sexta às 06:30 Brasília (09:30 UTC)
  schedule:
    - cron: '30 9 * * 1-5'

  # Permite disparo manual pelo GitHub
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Enviar apenas para email de teste'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  enviar-boletim:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar boletim v2
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BOLETIM_TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        run: |
          python boletim_netuno_v2.py
